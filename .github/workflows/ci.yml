name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Lint with ruff
        run: python -m ruff check .
      - name: Run tests
        run: python -m unittest discover -v
      - name: Validate and build Docker services
        run: |
          docker compose config --quiet
          docker compose build
      - name: Run tests in the restricted Linux container
        run: docker compose run --rm --no-deps --entrypoint python lab -m unittest discover -v
